plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'ame.project.kanae'
    compileSdk 36

    defaultConfig {
        applicationId "ame.project.kanae"
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName "12.2.5"
        ndk { abiFilters "arm64-v8a","x86_64"} //mobile
     //   ndk { abiFilters "x86_64"} // chrome os (desktop)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        viewBinding true
        aidl true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties',
                         'META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ── Media3 (ExoPlayer) ────────────────────────────────────────────────────
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media3:media3-session:1.10.1'
    implementation 'androidx.media3:media3-common:1.10.1'

    // ── NewPipe Extractor ─────────────────────────────────────────────────────
    // Pengganti yt-dlp — pure Java, extract YouTube stream URL langsung
    // Tidak butuh binary, tidak ada SELinux issue
    //implementation 'com.github.TeamNewPipe:NewPipeExtractor:0.26.3'
    implementation(project(":NewPipeExtractor:extractor"))

    implementation 'com.google.firebase:firebase-crashlytics:20.0.6'

    // fallback
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'


    // ── OkHttp (HTTP client + WebSocket untuk EulerStream) ────────────────────
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    // ── JSON ──────────────────────────────────────────────────────────────────
    implementation 'com.google.code.gson:gson:2.14.0'

    // ── Coroutines ────────────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'

    // ── Glide ─────────────────────────────────────────────────────────────────
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'

    // ── Preference ────────────────────────────────────────────────────────────
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ── NL Studio SDK ────────────────────────────────────────────────────────
    implementation project(':nlstudio-sdk')

    // ── Color Picker ──────────────────────────────────────────────────────────
    implementation 'com.github.duanhong169:colorpicker:1.1.6'

    // ── Testing ───────────────────────────────────────────────────────────────
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
